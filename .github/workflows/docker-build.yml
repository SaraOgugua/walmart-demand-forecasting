
name: Data Pipeline and Docker Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 pytest==9.1.1

      - name: Run data pipeline tests
        run: pytest tests/test_data_pipeline.py -v

      - name: Build Docker image
        run: docker build --tag walmart-demand-forecasting:ci .

